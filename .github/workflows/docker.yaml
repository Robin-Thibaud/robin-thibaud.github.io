name: Build & Push Docker Image

on:
  push:
   branches:
    - main

jobs:
  build-and-push-image:
   runs-on: ubuntu-latest
  
   permissions:
    contents: read #Autorise le serveur à lire le code
    packages: write #Autorise le serveur à stocker l'image
  
   steps:
    - name: Récupération du code
      uses: actions/checkout@v4
   
    - name: Connexion au GitHub Container Registry
      uses: docker/login-action@v3
      with:
       registry: ghcr.io
       username: ${{ github.actor}} #Récupération de mon pseudo
       password: ${{ secrets.GITHUB_TOKEN}} #Jeton éphémère

    - name: Préparation du nom de l'image en minuscule
      #Met en minuscule le nom du repo et le stocke dans une variable d'environnement GitHub
      run: |
        echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
   
    - name: Construction et publication
      uses: docker/build-push-action@v5
      with:
       context: . #Prends le dockerfile dans le dossier actuel
       push: true #Publie l'image une fois terminée
       tags: | #Création d'une liste de tags
        ghcr.io/${{ env.REPO }}:latest
        ghcr.io/${{ env.REPO }}:${{ github.sha }}