name: Build & Push Docker Image

on:
  push:
   branches:
    - main
   tags:
    - 'v*'

jobs:
  build-and-push-image:
   runs-on: ubuntu-latest
  
   permissions:
    contents: read # Autorise le serveur à lire le code
    packages: write # Autorise le serveur à stocker l'image
  
   steps:
    - name: Récupération du code
      uses: actions/checkout@v4
   
    - name: Connexion au GitHub Container Registry
      uses: docker/login-action@v3
      with:
       registry: ghcr.io
       username: ${{ github.actor}} # Récupération de mon pseudo
       password: ${{ secrets.GITHUB_TOKEN}} # Jeton éphémère

    - name: Préparation du nom de l'image en minuscule
      # Met en minuscule le nom du repo et le stocke dans une variable d'environnement GitHub
      run: |
        echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

    - name: Extraction des métadonnées (tags) pour Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ env.REPO }}
        # Cette section dit à Docker comment fabriquer les tags
        # 1. Si du code est push sur main alors l'image a le tag latest
        # 2. Si du code est push avec un tag (ex: v0.1.0) l'image aura le même nom
        # 3. Si du code est push il aura les 7 premiers caractères du hash 
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=ref,event=tag
          type=sha,format=short
   
    - name: Construction et publication
      uses: docker/build-push-action@v5
      with:
       context: . # Prend le dockerfile dans le dossier actuel
       push: true # Publie l'image une fois terminée
       # Reprend la liste des tags générée plus haut par l'étape meta
       tags: ${{ steps.meta.outputs.tags }}
       # Ajoute date, version... à l'image
       labels: ${{ steps.meta.outputs.labels }}